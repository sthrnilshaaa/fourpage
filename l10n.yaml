# UI strings live in lib/l10n/app_<locale>.arb; `flutter gen-l10n` (run
# automatically by `flutter pub get` / build) generates AppLocalizations.
# To add a language, copy app_en.arb to app_<code>.arb and translate it.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
