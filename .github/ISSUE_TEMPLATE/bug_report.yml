name: Bug report
description: Something in the app doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't attach books you don't have the rights to share.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a book
        2. Switch to Scrolled mode
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › About shows it.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Where did you install it from?
      options: [GitHub release, Google Play, Built it myself]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 16
  - type: input
    id: book
    attributes:
      label: Book format / source
      description: EPUB, PDF, DOCX...; and where the book is from (e.g. Project Gutenberg) if it only happens with one book.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
