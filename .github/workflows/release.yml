# Push a tag like v1.2.0 to publish a GitHub Release with one signed APK per
# CPU type (github flavor). The app's updater picks the APK whose name
# contains the phone's ABI.
#
# Signing uses the same key as looper_player. Secrets live in the `release`
# environment (Settings > Environments > release; add owner approval):
#   KEYSTORE_BASE64     base64 of android/app/release.keystore
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match pubspec version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the release environment"
              exit 1
            fi
          done
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/release.keystore"
          } > android/key.properties

      - name: Test
        run: flutter test

      - name: Build GitHub APKs
        run: flutter build apk --release --flavor github --split-per-abi

      - name: Name the files
        run: |
          mkdir -p out
          for apk in build/app/outputs/flutter-apk/app-*-github-release.apk; do
            abi=$(basename "$apk" | sed -E 's/app-(.*)-github-release.apk/\1/')
            cp "$apk" "out/Fourpages-$VERSION-$abi.apk"
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -l out

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Fourpages ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt

      - name: Remove signing key
        if: always()
        run: rm -f android/app/release.keystore android/key.properties
